services:
  mysql:
    image: mysql:8.0
    container_name: vankar_matrimony_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-vankar_root_pass}
      MYSQL_USER: ${MYSQL_USER:-vankar_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vankar_secure_pass}
      MYSQL_DATABASE: ${MYSQL_DB:-vankar_matrimony}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./next-nest/backend
      dockerfile: Dockerfile
    container_name: vankar_matrimony_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-vankar_app}:${MYSQL_PASSWORD:-vankar_secure_pass}@mysql:3306/${MYSQL_DB:-vankar_matrimony}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PORT=${PORT:-3000}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./next-nest/backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./next-nest/frontend
      dockerfile: Dockerfile
    container_name: vankar_matrimony_frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000/api/v1
    depends_on:
      - backend

volumes:
  mysql_data:
