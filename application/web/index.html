<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vankar Samaj Matrimony">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vankar Samaj Matrimony</title>
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #020B18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 40%, #082142 0%, #020B18 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      color: #D4AF37;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    }
    .splash-logo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 2px solid #D4AF37;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.45);
      margin-bottom: 18px;
      animation: pulse-glow 2.2s infinite ease-in-out;
      background-color: #04142B;
      object-fit: cover;
    }
    @keyframes pulse-glow {
      0% { transform: scale(0.97); box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
      50% { transform: scale(1.03); box-shadow: 0 0 32px rgba(212, 175, 55, 0.65); }
      100% { transform: scale(0.97); box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
    }
    .splash-title {
      font-size: 21px;
      font-weight: 700;
      color: #D4AF37;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-align: center;
      padding: 0 16px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .splash-subtitle {
      font-size: 13px;
      color: #F8E7B2;
      opacity: 0.9;
      margin-bottom: 28px;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .spinner-container {
      position: relative;
      width: 42px;
      height: 42px;
      margin-bottom: 14px;
    }
    .spinner-ring {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(212, 175, 55, 0.18);
      border-radius: 50%;
      border-top-color: #D4AF37;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.4px;
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <img src="icons/Icon-192.png" alt="Logo" class="splash-logo" onerror="this.style.display='none'">
    <div class="splash-title">All Gujarat Vankar Samaj</div>
    <div class="splash-subtitle">એક સમાજ, એક વિચાર, એક પરિવાર</div>
    <div class="spinner-container">
      <div class="spinner-ring"></div>
    </div>
    <div class="loading-text">એપ્લિકેશન શરૂ થઈ રહી છે... (Loading...)</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    // Auto-remove splash when Flutter canvas is mounted
    const splashObserver = new MutationObserver(() => {
      const flt = document.querySelector('flutter-view, flt-glass-pane');
      if (flt) {
        const splash = document.getElementById('loading-splash');
        if (splash) {
          splash.style.opacity = '0';
          splash.style.visibility = 'hidden';
          setTimeout(() => splash.remove(), 500);
        }
        splashObserver.disconnect();
      }
    });
    splashObserver.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js?v=20261005_v1" async></script>
</body>
</html>
