services:
  postgres:
    image: postgres:15-alpine
    container_name: vankar_matrimony_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vankar_matrimony}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vankar_matrimony}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./next-nest/backend
      dockerfile: Dockerfile
    container_name: vankar_matrimony_backend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vankar_matrimony}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PORT=${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./next-nest/backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./next-nest/frontend
      dockerfile: Dockerfile
    container_name: vankar_matrimony_frontend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:3000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
